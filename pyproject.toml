[project]
name = "virtual-poetry-museum"
version = "0.1.0"
description = "Museu virtual de poesia e textos com Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.39.0",
  "sqlalchemy>=2.0.36",
  "pymysql>=1.1.1",
  "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
